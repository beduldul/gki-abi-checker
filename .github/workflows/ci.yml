name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q gki_abi_checker.py
      - name: CLI help
        run: python gki_abi_checker.py --help
      - name: Smoke test on sample defconfig
        run: |
          cat > /tmp/defconfig <<'EOF'
          CONFIG_SLUB_DEBUG=y
          CONFIG_UNMAP_KERNEL_AT_EL0=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BBR=y
          EOF
          python gki_abi_checker.py /tmp/defconfig
          python gki_abi_checker.py /tmp/defconfig --json
